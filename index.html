<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="Logo.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble</title>
    <style>
        #countdown {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
    </style>
</head>
<body style="background-color: black;">
    <img src="Logo.svg" style="margin: 20px;">
    <div id="countdown">Loading...</div>

    <script>
        // 1. Set the target date and time you are counting down to
        const targetDate = new Date("Oct 23, 2026 23:59:59").getTime();

        // 2. Update the countdown every 1 second
        const timerInterval = setInterval(function() {

            // Get the current date and time
            const now = new Date().getTime();

            // Find the distance between now and the target date
            const distance = targetDate - now;

            // 3. Calculate time components for days, hours, minutes, and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // 4. Output the result in the element with id="countdown"
            document.getElementById("countdown").innerHTML = 
                days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

            // 5. If the countdown is finished, write some text
            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("countdown").innerHTML = "EVENT STARTED";
            }
        }, 1000);
    </script>
</body>
</html>
